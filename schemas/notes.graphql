# Schema snapshot of the notes plugin. The gateway uses it only when
# the app refuses introspection (NODE_ENV=production). Regenerate with
#   npm run schemas:snapshot -- notes

"""
An API token's non-secret metadata. The token value itself is never returned
except once, at creation time, via CreateApiTokenResult.token.
"""
type ApiToken {
  """DateTime"""
  createdAt: DateTime!

  """User who created the token."""
  createdByUserId: String!
  id: String!

  """DateTime"""
  lastUsedAt: DateTime
  name: String!
  orgId: String!

  """Non-secret display prefix (e.g. `cet_a1b2c3d4`) to identify the token."""
  tokenPrefix: String!
}

type AuthPayload {
  """Session JWT (30 days) — send as Bearer in Authorization header."""
  token: String!
  user: User!
}

input BooleanFilter {
  OR: [BooleanFilterOr!]
  eq: Boolean
  gt: Boolean
  gte: Boolean
  ilike: String

  """Array<undefined>"""
  inArray: [Boolean!]
  isNotNull: Boolean
  isNull: Boolean
  like: String
  lt: Boolean
  lte: Boolean
  ne: Boolean
  notIlike: String

  """Array<undefined>"""
  notInArray: [Boolean!]
  notLike: String
}

input BooleanFilterOr {
  eq: Boolean
  gt: Boolean
  gte: Boolean
  ilike: String

  """Array<undefined>"""
  inArray: [Boolean!]
  isNotNull: Boolean
  isNull: Boolean
  like: String
  lt: Boolean
  lte: Boolean
  ne: Boolean
  notIlike: String

  """Array<undefined>"""
  notInArray: [Boolean!]
  notLike: String
}

type CreateApiTokenResult {
  apiToken: ApiToken!

  """
  The full plaintext token — shown only once. Store it now; it is unrecoverable.
  """
  token: String!
}

