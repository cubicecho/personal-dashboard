# The whole personal cloud in one stack: all four apps, one shared Postgres,
# and the dashboard stitching them together.
#
#   docker compose -f docker-compose.stack.yml up --build
#
# Every app runs from its published Docker Hub image — nothing here builds a
# sibling repo, so this file works from a checkout of this repo alone and you
# get whatever that app actually shipped rather than whatever is on disk.
# Apps with no published image are commented out below; uncomment them once
# they are pushed. Only the dashboard itself is built, from this repo.
#
# ── Remote docker daemons ────────────────────────────────────────────────────
# `docker context ls` here shows an active `docker.lan` context, i.e. the
# daemon is another machine over SSH. Two consequences this file is built
# around:
#   * Nothing is bind-mounted. A bind mount resolves on the *daemon's*
#     filesystem and would silently mount an empty directory. The Postgres
#     bootstrap is baked into an image instead (deploy/postgres/), and every
#     other volume is a named one, which lives on the daemon where it belongs.
#   * Published ports land on the daemon's host, not on localhost. Set
#     PUBLIC_HOST=docker.lan in .env so the URLs the apps put in magic links
#     and CORS headers point at a host that actually answers.
#
# ── Why NODE_ENV is empty for three services ─────────────────────────────────
# auto-cal, notes and philotes all serve GraphQL through Apollo Server, which
# never sets `introspection` explicitly — so it takes Apollo's default,
# `NODE_ENV !== 'production'`. Under NODE_ENV=production they refuse
# introspection, the gateway cannot read their schema, and they cannot be
# stitched at all. Nothing in those repos exposes a knob for it, and this
# project's rule is that no app repo changes to appear on the dashboard.
#
# So this stack leaves NODE_ENV empty for them, which is NOT free. Per app:
#
#   auto-cal  any 36-char UUID sent as a bearer token authenticates as that
#             user id (server/src/index.ts:122), and magic links come back in
#             the API response. Note its own compose already sets
#             BYPASS_AUTH_UUID, so this widens a door that is ajar.
#   notes     stops serving its built Expo web client — /graphql still works,
#             but http://<host>:3002 no longer shows the notes UI.
#   philotes  skips its startup check that JWT_SECRET is strong (this file
#             requires one anyway), and returns magic links in responses.
#
# All three are LAN-only-single-user tradeoffs, the same footing as the
# gateway's own unauthenticated /health and /reload. Set <APP>_NODE_ENV=production
# in .env to take any of them back — that app then drops off the dashboard.
# The clean fix is for the gateway to fall back to a stored SDL when
# introspection is refused; until then, this is the knob.

name: cubicecho

services:
  postgres:
    build: ./deploy/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The per-app roles and databases are created by the init script below.
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback *on the daemon's host*, for psql and drizzle-kit run there;
      # 5434 to stay clear of a postgres installed on that machine. Reach it
      # from here with: ssh -L 5434:127.0.0.1:5434 docker.lan
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  autocal:
    image: vantreeseba/auto-cal:${AUTOCAL_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${AUTOCAL_NODE_ENV-}
      TZ: ${TZ:-UTC}
      PORT: "3001"
      DATABASE_URL: postgresql://autocal:autocal@postgres:5432/autocal
      # Bypass magic-link auth for the seeded demo user, as its own compose does.
      BYPASS_AUTH_UUID: ${AUTOCAL_BYPASS_AUTH_UUID:-00000000-0000-0000-0000-000000000001}
      EXPOSE_MAGIC_LINK: "true"
      APP_URL: ${AUTOCAL_APP_URL:-http://${PUBLIC_HOST:-localhost}:3001}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # ── notes — no published image yet ─────────────────────────────────────────
  # Not on Docker Hub (vantreeseba/ has auto-cal and philotes only). Push
  # `vantreeseba/notes` and uncomment; the shared Postgres already creates its
  # role and database, so nothing else has to change.
#  notes:
#    build: ../notes
#    restart: unless-stopped
#    environment:
#      NODE_ENV: ${NOTES_NODE_ENV-}
#      TZ: ${TZ:-UTC}
#      PORT: "4000"
#      # Postgres rather than the image's default embedded PGlite.
#      DATABASE_URL: postgres://notes:notes@postgres:5432/notes
#      APP_URL: ${NOTES_APP_URL:-http://${PUBLIC_HOST:-localhost}:3002}
#      DEMO_USER_ID: ${NOTES_DEMO_USER_ID:-00000000-0000-0000-0000-000000000001}
#      EXPOSE_MAGIC_LINK: "true"
#    ports:
#      # Published on 3002; the container still listens on its own 4000.
#      - "3002:4000"
#    depends_on:
#      postgres:
#        condition: service_healthy

  philotes:
    image: vantreeseba/philotes:${PHILOTES_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${PHILOTES_NODE_ENV-}
      TZ: ${TZ:-UTC}
      PORT: "3001"
      DATABASE_URL: postgres://philotes:philotes@postgres:5432/philotes
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — openssl rand -hex 32}
      APP_URL: ${PHILOTES_APP_URL:-http://${PUBLIC_HOST:-localhost}:3003}
    ports:
      # Published on 3003 to stay clear of auto-cal, which also listens on 3001.
      - "3003:3001"
    volumes:
      - philotes-avatars:/avatars
    depends_on:
      postgres:
        condition: service_healthy

  # ── eunomia — no published image yet ───────────────────────────────────────
  # Not on Docker Hub. It is also the one app that needs no NODE_ENV tradeoff
  # (Yoga allows introspection regardless), so it is the most valuable one to
  # publish. Push `vantreeseba/eunomia` and uncomment.
#  eunomia:
#    build:
#      context: ../eunomia
#      dockerfile: apps/server/Dockerfile
#    restart: unless-stopped
#    environment:
#      # Serves GraphQL through Yoga, which allows introspection regardless of
#      # NODE_ENV — this is the one app that needs no tradeoff to be stitched.
#      TZ: ${TZ:-UTC}
#      PORT: "4000"
#      DATABASE_URL: postgres://eunomia:eunomia@postgres:5432/eunomia
#      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env — openssl rand -base64 32}
#      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://${PUBLIC_HOST:-localhost}:4000}
#      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-90}
#      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
#      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
#      UNSAFE_LOCAL_NETWORK: ${UNSAFE_LOCAL_NETWORK:-false}
#    ports:
#      - "4000:4000"
#    depends_on:
#      postgres:
#        condition: service_healthy
#    healthcheck:
#      test:
#        - CMD
#        - node
#        - -e
#        - "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
#      interval: 30s
#      timeout: 5s
#      retries: 3
#      start_period: 60s

  dashboard:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      TZ: ${TZ:-UTC}
      # Service names on the compose network, so these are the containers'
      # own internal ports, not the host ports published above.
      PLUGIN_AUTOCAL_URL: http://autocal:3001/graphql
      PLUGIN_PHILOTES_URL: http://philotes:3001/graphql
      # eunomia has no published image, so it runs outside this stack (its own
      # repo's compose). Reached over the host rather than the compose network;
      # PUBLIC_HOST has to resolve from inside a container, which a LAN name
      # does since containers use the daemon host's resolver. Point this
      # anywhere else and the dashboard follows.
      PLUGIN_EUNOMIA_URL: ${PLUGIN_EUNOMIA_URL:-http://${PUBLIC_HOST:-localhost}:4000/graphql}
      # notes: no published image and nothing running — uncomment with the
      # service above once vantreeseba/notes exists.
      #PLUGIN_NOTES_URL: http://notes:4000/graphql
      # Server-side credentials. Anything the browser sets in the ⚙ panel wins
      # over these. eunomia's rides x-api-key by default (a registerDevice
      # device key); the rest ride Authorization as a bearer token.
      PLUGIN_AUTOCAL_TOKEN: ${PLUGIN_AUTOCAL_TOKEN:-}
      PLUGIN_NOTES_TOKEN: ${PLUGIN_NOTES_TOKEN:-}
      PLUGIN_PHILOTES_TOKEN: ${PLUGIN_PHILOTES_TOKEN:-}
      PLUGIN_EUNOMIA_TOKEN: ${PLUGIN_EUNOMIA_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      # Only ordering, and only for services that exist here — the gateway
      # boots against whatever is up, reports the rest as down, and
      # `curl -XPOST <host>:3000/reload` picks up an app that started late
      # (or one running outside this stack) without restarting anything.
      - autocal
      - philotes

volumes:
  postgres-data:
  philotes-avatars:
