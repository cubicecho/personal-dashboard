name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile; the server runs TypeScript sources directly
          # via node's type stripping, so the runtime major matters.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Hermetic: the tests start their own fixture plugin on an ephemeral
      # port, so nothing needs to be running here.
      - run: npm test
